name: Build web port (Minecraft 1.0.0)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # TeaVM на ~1000 классах декомпилята съедает много памяти
      - name: Build (TeaVM -> JS)
        run: set -o pipefail; mvn -B -ntp package 2>&1 | tee build.log
        env:
          MAVEN_OPTS: -Xmx6g -Xss16m

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Готовый сайт: index.html, mc100.js, akrile.js, extras.js, assets.akrile
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: mc100-web
          path: target/site
          if-no-files-found: error
